name: flutter_lid_effect
description: A Flutter plugin for macOS that reads MacBook lid angles and adds smooth perspective, blur animation and gradient dimming to your app.
version: 0.1.1
repository: https://github.com/JuYiYang/flutter_lid_effect
issue_tracker: https://github.com/JuYiYang/flutter_lid_effect/issues
topics:
  - macos
  - animation
  - sensor
  - blur
  - lid-angle
screenshots:
  - description: Simulated MacBook lid angles driving the real Flutter effect widget.
    path: doc/media/lid-effect-preview.gif
environment:
  sdk: ^3.10.3
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterLidEffectPlugin
  assets:
    - LICENSE
    - NOTICE
